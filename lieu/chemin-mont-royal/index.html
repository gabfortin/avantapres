  <title>Chemin multifonctionnel mont Royal — Avant / Après</title>
  <meta name="description" content="Nouveau chemin multifonctionnel au parc du Mont-Royal, entre le chemin de la Côte-des-Neiges et le lac aux Castors. Avant sa transformation en sentier cyclopédestre intégré au paysage du parc, cet espace était occupé par les voitures, qui circulaient vers l’est sur deux des quatre voies du chemin Remembrance. Les personnes qui souhaitaient accéder au parc depuis l’intersection des chemins Remembrance et de la Côte-des-Neiges devaient emprunter des trottoirs étroits et peu accueillants, en bordure de la circulation automobile. La réduction du chemin Remembrance de quatre à deux voies carrossables — une dans chaque direction — a permis de renaturaliser ce vaste secteur du parc et d’offrir une expérience immersive en pleine nature aux personnes qui accèdent au mont Royal à pied ou à vélo depuis le secteur de Côte-des-Neiges. La transformation est spectaculaire. C’est l’un des legs de l’administration de Projet Montréal sur le mont Royal dont je suis le plus fier.">
