<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Avant / Après — Montréal qui verdit</title>
  <meta name="description" content="Carte interactive des espaces publics transformés et verdis à Montréal grâce à Projet Montréal.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Avant / Après — Montréal qui verdit">
  <meta property="og:description" content="Carte interactive des espaces publics transformés et verdis à Montréal grâce à Projet Montréal.">
  <meta property="og:image" content="https://avantapres.gabfortin.com/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://avantapres.gabfortin.com/">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Avant / Après — Montréal qui verdit">
  <meta name="twitter:description" content="Carte interactive des espaces publics transformés et verdis à Montréal grâce à Projet Montréal.">
  <meta name="twitter:image" content="https://avantapres.gabfortin.com/assets/img/og-image.png">

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <link rel="stylesheet" href="assets/css/style.css?v=2">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4C10 4 4 10 4 18c0 1.1.9 2 2 2 8 0 14-6 14-16Z" fill="#fff"/>
          <path d="M6 20 18 6" stroke="rgba(15,122,55,0.55)" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-word">Avant<span>/</span>Après</div>
        <div class="brand-sub">Montréal qui se verdit</div>
      </div>
    </div>

    <div class="header-stats">
      <div class="stat-pill"><strong id="stat-count">–</strong><span>lieux</span></div>
      <div class="stat-pill"><strong id="stat-boroughs">–</strong><span>arrondiss.</span></div>
    </div>

    <div class="header-spacer"></div>

    <div class="borough-filter">
      <select id="borough-select" aria-label="Filtrer par arrondissement">
        <option value="all">Tous les arrondissements</option>
      </select>
    </div>
  </header>

  <div id="map" role="application" aria-label="Carte interactive des projets de verdissement"></div>

  <div class="intro-toast" id="intro-toast">
    <span class="dot"></span>
    Cliquez sur un point vert pour voir la transformation
  </div>

  <div class="credits-badge">
    <a class="credit-avatar" href="https://gabfortin.com" target="_blank" rel="noopener noreferrer" title="Gabriel Fortin" aria-label="Gabriel Fortin">
      <img src="assets/img/Gab.png" alt="Gabriel Fortin">
    </a>
    <a class="credit-avatar" href="https://projetmontreal.org/equipe/alexander-norris" target="_blank" rel="noopener noreferrer" title="Alex Norris" aria-label="Alex Norris">
      <img src="assets/img/Alex.jpg" alt="Alex Norris">
    </a>
    <span class="credits-label">Créé par Gabriel Fortin et Alex Norris</span>
  </div>

  <div class="overlay-scrim" id="overlay-scrim"></div>

  <aside class="detail-panel" id="detail-panel" aria-hidden="true">
    <button class="detail-close" id="detail-close" aria-label="Fermer">✕</button>

    <div class="ba-slider" id="ba-slider"></div>

    <div class="detail-body">
      <span class="detail-eyebrow">🌱 Projet Montréal</span>
      <h2 id="detail-title">—</h2>
      <p class="brand-sub" id="detail-borough" style="font-size:0.85rem; margin:0 0 4px;">—</p>
      <p class="detail-desc" id="detail-desc">—</p>

      <div class="detail-meta">
        <div>
          <div class="label">Avant</div>
          <div class="value before-color" id="meta-before-date">—</div>
        </div>
        <div>
          <div class="label">Après</div>
          <div class="value after-color" id="meta-after-date">—</div>
        </div>
        <div id="meta-author-row">
          <div class="label">Auteur</div>
          <div class="value" id="meta-author">—</div>
        </div>
      </div>
    </div>

    <div class="detail-close-mobile-wrap">
      <button class="detail-close-mobile" id="detail-close-mobile" aria-label="Fermer">✕</button>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
